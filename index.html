<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для Ақжайны</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f5f5f5, #ffffff);
        font-family: Arial, sans-serif;
    }

    .card {
        width: 90%;
        max-width: 380px;
        background: white;
        padding: 40px 25px;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.10);
    }

    .emoji {
        font-size: 60px;
        margin-bottom: 18px;
    }

    h1 {
        color: #222;
        margin-bottom: 15px;
    }

    p {
        color: #666;
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    button {
        border: none;
        padding: 13px 25px;
        margin: 6px;
        border-radius: 30px;
        font-size: 17px;
        cursor: pointer;
        transition: 0.25s;
    }

    button:hover {
        transform: scale(1.06);
    }

    .main-btn,
    .yes {
        background: #222;
        color: white;
    }

    .no {
        background: #eee;
        color: #555;
    }

    .screen {
        display: none;
        animation: appear 0.5s ease;
    }

    .active {
        display: block;
    }

    .name {
        color: #222;
        font-weight: bold;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="card">

    <!-- Первый экран -->
    <div id="screen1" class="screen active">

        <div class="emoji">💌</div>

        <h1>Ақжайна</h1>

        <p>Как ты себя чувствуешь?</p>

        <button class="main-btn" onclick="nextScreen()">
            Дальше
        </button>

    </div>


    <!-- Второй экран -->
    <div id="screen2" class="screen">

        <div class="emoji">🤔</div>

        <h1>Есть один вопрос...</h1>

        <p>Нужен ли тебе Арсен?</p>

        <button class="yes" onclick="yesAnswer()">
            Да
        </button>

        <button class="no" onclick="noAnswer()">
            Нет
        </button>

    </div>


    <!-- Если нажала ДА -->
    <div id="screenYes" class="screen">

        <div class="emoji">🌷</div>

        <h1>Выздоравливай, Ақжайна!</h1>

        <p>
            Поправляйся скорее.<br><br>
            Набирайся сил,<br>
            больше улыбайся<br>
            и береги себя.
        </p>

        <p>
            С заботой,<br>
            <span class="name">Арсенчик Айтишник 👨‍💻</span>
        </p>

    </div>


    <!-- Если нажала НЕТ -->
    <div id="screenNo" class="screen">

        <div class="emoji">🔒</div>

        <h1>Не-а 😄</h1>

        <p>
            Тогда открытка не откроется.
        </p>

        <button class="main-btn" onclick="tryAgain()">
            Попробовать ещё раз
        </button>

    </div>

</div>


<script>
function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function nextScreen() {
    showScreen("screen2");
}

function yesAnswer() {
    showScreen("screenYes");
}

function noAnswer() {
    showScreen("screenNo");
}

function tryAgain() {
    showScreen("screen2");
}
</script>

</body>
</html>
